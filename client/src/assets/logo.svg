<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" fill="none">
  <defs>
    <linearGradient id="gold" x1="90" y1="40" x2="340" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3D77A"/>
      <stop offset="0.45" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8F6B12"/>
    </linearGradient>
    <linearGradient id="goldText" x1="520" y1="120" x2="1050" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6C85A"/>
      <stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#A47B17"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Premium emblem -->
  <g filter="url(#shadow)">
    <circle cx="230" cy="230" r="174" fill="#111111"/>
    <circle cx="230" cy="230" r="155" stroke="url(#gold)" stroke-width="7"/>
    <circle cx="230" cy="230" r="132" stroke="#3A3A3A" stroke-width="2"/>

    <!-- Serving cloche -->
    <path d="M126 257C126 190 171 140 230 140C289 140 334 190 334 257H126Z"
          fill="url(#gold)" opacity="0.98"/>
    <path d="M142 247C151 192 184 158 230 158C276 158 309 192 318 247"
          stroke="#111111" stroke-width="12" stroke-linecap="round"/>
    <rect x="112" y="249" width="236" height="20" rx="10" fill="#111111"/>
    <rect x="130" y="272" width="200" height="7" rx="3.5" fill="url(#gold)"/>
    <circle cx="230" cy="132" r="14" fill="#111111"/>
    <rect x="224" y="113" width="12" height="20" rx="6" fill="#111111"/>

    <!-- Small bite mark / sparkle motif -->
    <circle cx="286" cy="205" r="10" fill="#111111"/>
    <circle cx="301" cy="193" r="6" fill="#111111"/>
    <path d="M302 172L312 155M320 187L339 181" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="455" y="270"
        font-family="Montserrat, Poppins, Arial, sans-serif"
        font-size="170"
        font-weight="800"
        letter-spacing="-7"
        fill="#111111">Bite</text>
  <text x="780" y="270"
        font-family="Montserrat, Poppins, Arial, sans-serif"
        font-size="170"
        font-weight="800"
        letter-spacing="-7"
        fill="url(#goldText)">mo</text>

  <!-- Premium underline -->
  <path d="M465 315H1085" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
  <path d="M465 315H710" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="1098" cy="315" r="5" fill="url(#gold)"/>

  <!-- Tagline -->
  <text x="468" y="365"
        font-family="Montserrat, Poppins, Arial, sans-serif"
        font-size="30"
        font-weight="500"
        letter-spacing="8"
        fill="#555555">BITE • ORDER • ENJOY</text>
</svg>